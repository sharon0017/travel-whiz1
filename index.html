<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Provider</title>
    <!-- Add your CSS link here if you have one -->
</head>
<body>
    <header>
        <nav>
            <h1>Vendor Registration</h1>
        </nav>
    </header>

    <div class="container" style="max-width: 400px; margin-top: 50px;">
        <form id="vendorForm">
            <input type="text" placeholder="Name" required>
            <div class="error-msg">Name is required</div>
            
            <textarea placeholder="Services" rows="4" required></textarea>
            
            <button type="submit" class="btn" style="margin-top: 20px;">Register</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
